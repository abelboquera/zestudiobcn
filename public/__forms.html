<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Formularios</title>
  </head>
  <body>
    <!-- Formulario estático para que Netlify detecte "contacto" en el build.
         El formulario real está en src/components/ContactForm.tsx -->
    <form name="contacto" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contacto" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="subject">
        <option value="produccion">Producción</option>
        <option value="grabacion">Grabación / Mezcla / Mastering</option>
        <option value="combos">Escuela de Combos</option>
        <option value="clases">Clases particulares</option>
        <option value="otro">Otro</option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
